<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
{% seo %}
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/design-system.css">
</head>
<body>

<header class="rf-header">
  <nav class="rf-nav" aria-label="Primary">
    <a class="rf-brand" href="/">
      <span>~/rafych/blog</span>
      <span class="rf-brand-cursor" aria-hidden="true"></span>
    </a>
    <div class="rf-nav-controls">
      <button type="button" class="rf-btn-min" id="lang-toggle-btn" title="Switch language">EN</button>
      <a class="rf-btn-min is-solid" href="/" id="home-btn" data-i18n="home">Home</a>
    </div>
  </nav>
</header>

<main class="rf-main rf-main--narrow">
  <p class="rf-page-label" id="page-label" data-i18n="pageLabel">Blog</p>
  <h1 class="rf-page-title" id="page-title" data-i18n="pageTitle">All posts</h1>
  <div class="search-box">
    <input type="text" class="search-input" id="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="Search...">
  </div>
  <div class="blog-list" id="blog-list">
    <div class="blog-empty" id="blog-loading">Loading...</div>
  </div>
  <div class="search-pagination" id="search-pagination" style="display:none;"></div>
</main>

<footer class="rf-footer">
  <div class="rf-footer-inner">
    <span><span id="footer-year">© 2026 Rafych</span> — <span id="footer-made" data-i18n="made">made with</span> <span class="heart">♥</span></span>
    <span>EOF // blog</span>
  </div>
</footer>

<script src="/assets/js/lang.js"></script>
<script src="/assets/js/blog-posts.js"></script>
<script src="/assets/js/fx.js"></script>
<script>
var C = {
  en: {
    title: 'All posts | Rafych',
    home: 'Home',
    pageLabel: 'Blog',
    pageTitle: 'Everything, unlocked',
    searchPlaceholder: 'Dig through the archive…',
    empty: 'Nothing here yet.\nKnowledge takes time to brew.',
    noResults: 'Nothing matches that.\nTry another search.',
    loading: 'Fetching posts…',
    prevBtn: '‹ Prev',
    nextBtn: 'Next ›',
    made: 'made with'
  },
  ru: {
    title: 'Все посты | Rafych',
    home: 'Главная',
    pageLabel: 'Блог',
    pageTitle: 'Всё в открытом доступе',
    searchPlaceholder: 'Копаемся в архиве…',
    empty: 'Пока ничего нет.\nЗнаниям нужно время, чтобы созреть.',
    noResults: 'Совпадений не найдено.\nПопробуйте другой запрос.',
    loading: 'Загружаем посты…',
    prevBtn: '‹ Назад',
    nextBtn: 'Далее ›',
    made: 'сделано с'
  }
};

var currentLang = RafychLang.detect();
var langBtn = document.getElementById('lang-toggle-btn');

var postList = RafychBlog.createListController({
  listEl: document.getElementById('blog-list'),
  pagEl: document.getElementById('search-pagination'),
  pageSize: 10,
  dict: function () { return C[currentLang]; }
});

document.getElementById('search-input').addEventListener('input', function (e) {
  postList.setQuery(e.target.value);
});

function syncLang() {
  RafychLang.apply(C[currentLang], currentLang);
  if (langBtn) langBtn.textContent = currentLang.toUpperCase();
  postList.render();
}

if (langBtn) {
  langBtn.addEventListener('click', function () {
    currentLang = currentLang === 'en' ? 'ru' : 'en';
    try { localStorage.setItem('lang', currentLang); } catch (e) {}
    syncLang();
  });
}

syncLang();
postList.load();
document.getElementById('footer-year').textContent = '© ' + new Date().getFullYear() + ' Rafych';
RafychFX.init();
</script>

</body>
</html>
