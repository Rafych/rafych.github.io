title: Rafych
description: Rafych's personal website and blog
url: "https://rafych.github.io"
baseurl: ""
lang: en
timezone: Europe/Moscow
author: Rafych
logo: /icon.png

defaults:
  - scope:
      path: ""
    values:
      image: /icon.png
  - scope:
      path: ""
      type: "posts"
    values:
      layout: default

twitter:
  card: summary
social:
  name: Rafych
  links:
    - https://github.com/Rafych

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true
  auto_ids: true
  syntax_highlighter: rouge

permalink: /blog/:year/:month/:day/:title/

collections:
  posts:
    output: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor

include: [".well-known"]
