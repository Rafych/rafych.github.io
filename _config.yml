title: Rafych
description: Rafych's personal website and blog
url: "https://rafych.github.io"
baseurl: ""
lang: en
author: Rafych
twitter:
  card: summary
social:
  name: Rafych
  links:
    - https://github.com/Rafych

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /blog/:year/:month/:day/:title/

collections:
  posts:
    output: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
